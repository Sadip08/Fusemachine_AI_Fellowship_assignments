[project]
name = "week17-mlops"
version = "0.1.0"
description = "MLOps implementation for the Week 17 classical ML and agentic AI tracks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "evidently==0.7.16",
  "fastapi>=0.115,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "mlflow>=2.17,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

